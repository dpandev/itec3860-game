plugins {
    id 'java'
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.0.0'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // JUnit 5 (Jupiter): API + Engine
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly  'org.junit.jupiter:junit-jupiter-engine'

    // Mockito (optional but handy)
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
}

test {
  useJUnitPlatform()
  reports {
    junitXml.required = true; html.required = true
  }
}

checkstyle {
    toolVersion = '11.0.0'
    enableExternalDtdLoad = true
    configFile = file('config/checkstyle/google_checks.xml')
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false; html.required = true
    }
}

spotless {
    java {
        // Google Java Format — same everywhere, regardless of IDE
        googleJavaFormat('1.25.0')
        removeUnusedImports()
        target 'src/**/*.java'
    }
}

tasks.named('check') { dependsOn 'spotlessCheck' }

pmd {
    toolVersion = '6.55.0'
    consoleOutput = true
    incrementalAnalysis = true
    ruleSets = [
        'category/java/bestpractices.xml',
        'category/java/errorprone.xml',
        'category/java/codestyle.xml'
    ]
}
tasks.withType(Pmd).configureEach {
    reports {
        xml.required = false; html.required = true
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true; html.required = true
    }
}

check.dependsOn jacocoTestReport

 application {
     mainClass = 'avengers.core.Game'
 }
