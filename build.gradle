plugins {
    id 'java'
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.0.0'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Root project depends on the game module
    implementation project(':game')
}

test {
  useJUnitPlatform()
  reports {
    junitXml.required = true; html.required = true
  }
}

application {
    mainClass.set('avengers.client.runtime.ClientApp')
}

// Create executable JAR with all dependencies
tasks.register('fatJar', Jar) {
    archiveBaseName = 'solo-leveling-game'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Main-Class': 'avengers.client.runtime.ClientApp',
            'Implementation-Title': 'Solo Leveling - Shadow Quest',
            'Implementation-Version': project.version
        )
    }

    // Include all runtime dependencies and compiled classes
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    with jar
}

// Make distZip and distTar include the fat JAR
distributions {
    main {
        contents {
            from(fatJar) {
                into 'lib'
            }
        }
    }
}

